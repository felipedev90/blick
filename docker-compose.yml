services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blick
      POSTGRES_PASSWORD: blick
      POSTGRES_DB: blick
    ports:
      - "5432:5432"
    volumes:
      - blick_db_data:/var/lib/postgresql/data
      - ./api/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blick"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./api/.env
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'')"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: ./web
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  blick_db_data:
