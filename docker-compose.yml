services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blick
      POSTGRES_PASSWORD: blick
      POSTGRES_DB: blick
    ports:
      - "5432:5432"
    volumes:
      - blick_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blick"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    env_file:
      - ./api/.env
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  blick_db_data:
